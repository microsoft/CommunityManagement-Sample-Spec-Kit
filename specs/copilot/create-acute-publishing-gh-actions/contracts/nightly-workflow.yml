# ──────────────────────────────────────────────────────────────
# Contract: Nightly Build & Deploy Workflow
# File: .github/workflows/nightly.yml
# ──────────────────────────────────────────────────────────────
# This document defines the YAML contract for the nightly workflow.
# It is the reference specification for the implementation task.
# ──────────────────────────────────────────────────────────────

name: Nightly Build & Deploy

# ── Triggers (FR-002, FR-003) ─────────────────────────────────
on:
  schedule:
    - cron: "0 0 * * *" # Midnight UTC daily (FR-002)
  workflow_dispatch: # Manual trigger (FR-003)

# ── Concurrency (FR-012) ─────────────────────────────────────
concurrency:
  group: nightly-build
  cancel-in-progress: false # Queue, don't cancel in-flight runs

# ── Shared environment variables ──────────────────────────────
env:
  REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}

# ── Job 1: Validate (FR-004, FR-013, FR-015) ─────────────────
# Runs the complete CI validation suite. Mirrors ci.yml steps.
# Failure here prevents any build or deployment.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24" # FR-015: same as CI
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build design tokens
        run: npm run tokens:build -w @acroyoga/tokens

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -w @acroyoga/web

      - name: Build web app
        run: npm run build -w @acroyoga/web

      - name: Check bundle size
        run: |
          INDEX_HTML="apps/web/.next/server/app/index.html"
          TOTAL_GZ=0
          while IFS= read -r chunk; do
            CHUNK_FILE="apps/web/.next/static/chunks/${chunk}"
            if [ -f "$CHUNK_FILE" ]; then
              GZ_SIZE=$(gzip -c "$CHUNK_FILE" | wc -c)
              TOTAL_GZ=$((TOTAL_GZ + GZ_SIZE))
            fi
          done < <(grep -oP 'src="/_next/static/chunks/\K[^"]+(?=")' "$INDEX_HTML" 2>/dev/null)
          TOTAL_KB=$((TOTAL_GZ / 1024))
          echo "Initial JS bundle size (gzipped): ${TOTAL_KB}KB"
          if [ "$TOTAL_KB" -gt 200 ]; then
            echo "::error::Initial JS bundle size (${TOTAL_KB}KB gzipped) exceeds 200KB budget"
            exit 1
          fi

      - name: Run token tests
        run: npm run test -w @acroyoga/tokens

      - name: Run shared-ui tests
        run: npm run test -w @acroyoga/shared-ui

      - name: Run shared tests
        run: npm run test -w @acroyoga/shared

      - name: Run web tests
        run: npm run test -w @acroyoga/web

      - name: Run mobile unit tests
        run: npm run test -w @acroyoga/mobile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (Playwright)
        run: npx playwright test --config apps/web/playwright.config.ts
        env:
          CI: true

      - name: i18n string lint
        run: bash scripts/lint-i18n.sh

      - name: Build Storybook
        run: npx storybook build --config-dir apps/web/.storybook -o apps/web/storybook-static

      - name: Storybook a11y audit
        run: |
          npx concurrently -k -s first -n storybook,test \
            "npx http-server apps/web/storybook-static --port 6006 --silent" \
            "npx wait-on http://localhost:6006 && npx test-storybook --url http://localhost:6006 --config-dir apps/web/.storybook"

  # ── Job 2: Build and Push (FR-005, FR-006, FR-007, FR-016) ──
  # Builds Docker image and pushes to shared ACR with nightly tags.
  # Uses staging identity (main-branch FIC, ACR push access).
  build-and-push:
    runs-on: ubuntu-latest
    needs: [validate] # FR-013: only if validation passes
    outputs:
      image-tag-date: ${{ steps.meta.outputs.date-tag }}
      image-tag-sha: ${{ steps.meta.outputs.sha-tag }}
    permissions:
      id-token: write # FR-016: OIDC
      contents: read # FR-016

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC — staging identity for ACR push)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ env.REGISTRY }}

      - name: Generate image tags
        id: meta
        run: |
          DATE_TAG="nightly-$(date -u +'%Y%m%d')"
          SHA_TAG="nightly-sha-${GITHUB_SHA:0:7}"
          echo "date-tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha-tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "Date tag: ${DATE_TAG}"
          echo "SHA tag: ${SHA_TAG}"

      - name: Build and push container image (FR-005, FR-006, FR-007)
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/acroyoga-web:${{ steps.meta.outputs.date-tag }} \
            -t ${{ env.REGISTRY }}/acroyoga-web:${{ steps.meta.outputs.sha-tag }} \
            .
          docker push ${{ env.REGISTRY }}/acroyoga-web:${{ steps.meta.outputs.date-tag }}
          docker push ${{ env.REGISTRY }}/acroyoga-web:${{ steps.meta.outputs.sha-tag }}

  # ── Job 3: Deploy to Nightly (FR-008, FR-009, FR-010, FR-011) ─
  # Deploys to the dedicated nightly Container App and runs smoke tests.
  # Uses nightly identity via GitHub environment OIDC.
  deploy-nightly:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: nightly # FR-011: dedicated GitHub environment
    permissions:
      id-token: write # FR-016: OIDC
      contents: read # FR-016

    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag-date }}
      RESOURCE_GROUP: rg-acroyoga-nightly
      APP_NAME: ca-acroyoga-web-nightly

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC — nightly managed identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_NIGHTLY }} # FR-010
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to nightly (FR-008)
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ${{ env.APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.REGISTRY }}/acroyoga-web:${{ env.IMAGE_TAG }}

      - name: Wait for readiness (FR-009)
        run: |
          APP_URL=$(az containerapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Waiting for https://${APP_URL}/api/ready ..."
          curl --retry 10 --retry-delay 10 --retry-all-errors -sf \
            "https://${APP_URL}/api/ready"

      - name: Smoke test — health endpoint (FR-009)
        run: |
          APP_URL=$(az containerapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          RESPONSE=$(curl -sf "https://${APP_URL}/api/health")
          echo "Health response: ${RESPONSE}"
          echo "${RESPONSE}" | grep -q '"status":"healthy"'

      - name: Smoke test — home page (FR-009)
        run: |
          APP_URL=$(az containerapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl -sf "https://${APP_URL}/" | head -20
