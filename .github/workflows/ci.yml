name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build design tokens
        run: npm run tokens:build -w @acroyoga/tokens

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (includes jsx-a11y)
        run: npm run lint -w @acroyoga/web

      - name: Build web app
        run: npm run build -w @acroyoga/web

      - name: Check bundle size
        run: |
          # Check gzipped size of initial (first-load) JS chunks only.
          # Uses build-manifest.json rootMainFiles — these are the chunks loaded
          # on every page navigation, matching the Constitution VI 200KB compressed budget.
          node -e "
            const fs = require('fs');
            const zlib = require('zlib');
            const path = require('path');
            const manifest = JSON.parse(fs.readFileSync('apps/web/.next/build-manifest.json', 'utf8'));
            const initial = manifest.rootMainFiles || [];
            let totalGz = 0;
            for (const rel of initial) {
              const p = path.join('apps/web/.next', rel);
              if (fs.existsSync(p)) {
                const buf = fs.readFileSync(p);
                totalGz += zlib.gzipSync(buf, { level: 9 }).length;
              }
            }
            const kb = Math.ceil(totalGz / 1024);
            console.log('Initial JS bundle (gzipped): ' + kb + 'KB');
            if (kb > 200) {
              console.error('::error::Initial JS bundle (' + kb + 'KB gzipped) exceeds 200KB budget (Constitution VI)');
              process.exit(1);
            }
          "

      - name: Run token tests
        run: npm run test -w @acroyoga/tokens

      - name: Run shared-ui tests
        run: npm run test -w @acroyoga/shared-ui

      - name: Run web tests
        run: npm run test -w @acroyoga/web

      - name: i18n string lint (Constitution VIII, QG-9)
        run: bash scripts/lint-i18n.sh

      - name: Build Storybook
        run: npx storybook build --config-dir apps/web/.storybook -o apps/web/storybook-static

      - name: Storybook a11y audit (FR-019, QG-6)
        run: |
          npx concurrently -k -s first -n storybook,test \
            "npx http-server apps/web/storybook-static --port 6006 --silent" \
            "npx wait-on http://localhost:6006 && npx test-storybook --url http://localhost:6006"
