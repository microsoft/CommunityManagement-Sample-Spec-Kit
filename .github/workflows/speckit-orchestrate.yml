name: Spec-Kit Orchestrate

# Autonomous spec-kit pipeline: feature description → spec → plan → tasks → issues
# Triggered by workflow_dispatch with a feature description input

on:
  workflow_dispatch:
    inputs:
      feature-name:
        description: "Short kebab-case name for the feature (e.g., user-profiles)"
        required: true
        type: string
      feature-description:
        description: "Natural language description of the feature to build"
        required: true
        type: string
      spec-number:
        description: "Three-digit spec number (e.g., 022)"
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Create spec folder structure
        run: |
          SPEC_DIR="specs/${{ inputs.spec-number }}-${{ inputs.feature-name }}"
          mkdir -p "${SPEC_DIR}/contracts" "${SPEC_DIR}/checklists"
          echo "SPEC_DIR=${SPEC_DIR}" >> "$GITHUB_ENV"

      - name: Create initial spec placeholder
        run: |
          cat > "${SPEC_DIR}/spec.md" << SPECEOF
          # Feature Specification: ${{ inputs.feature-name }}

          **Feature Branch**: \`${{ inputs.spec-number }}-${{ inputs.feature-name }}\`
          **Created**: $(date +%Y-%m-%d)
          **Status**: Draft — Awaiting Copilot agent processing
          **Input**: User description: "${{ inputs.feature-description }}"

          > This spec was auto-generated by the spec-kit orchestration pipeline.
          > A Copilot agent session will populate the full specification using
          > the speckit.specify → speckit.plan → speckit.tasks → speckit.taskstoissues
          > pipeline.
          SPECEOF

      - name: Commit spec scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="copilot/${{ inputs.spec-number }}/orchestrate"
          git checkout -b "${BRANCH}"
          git add "${SPEC_DIR}"
          git commit -m "chore: scaffold spec ${{ inputs.spec-number }}-${{ inputs.feature-name }}"
          git push origin "${BRANCH}"

      - name: Create orchestration issue for Copilot agent
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const specNumber = '${{ inputs.spec-number }}';
            const featureName = '${{ inputs.feature-name }}';
            const description = `${{ inputs.feature-description }}`;
            const specDir = `specs/${specNumber}-${featureName}`;

            const body = [
              `## Spec-Kit Orchestration: ${specNumber}-${featureName}`,
              '',
              '### Feature Description',
              description,
              '',
              '### Agent Instructions',
              '',
              'This issue was created by the spec-kit orchestration pipeline.',
              'Complete the following steps in order:',
              '',
              `1. **Specify**: Run \`/speckit.specify\` to populate \`${specDir}/spec.md\``,
              `2. **Plan**: Run \`/speckit.plan\` to create \`${specDir}/plan.md\``,
              `3. **Tasks**: Run \`/speckit.tasks\` to create \`${specDir}/tasks.md\``,
              `4. **Issues**: Run \`/speckit.taskstoissues\` to create GitHub issues from tasks`,
              '',
              `Branch: \`copilot/${specNumber}/orchestrate\``,
              `Spec directory: \`${specDir}/\``,
              '',
              '### Acceptance Criteria',
              '',
              '- [ ] spec.md is complete with user stories and requirements',
              '- [ ] plan.md is complete with technical design',
              '- [ ] tasks.md is complete with ordered task list',
              '- [ ] GitHub issues created for each task with appropriate labels',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Orchestrate] Spec ${specNumber}: ${featureName}`,
              body: body,
              labels: ['speckit-orchestrate', 'copilot']
            });
