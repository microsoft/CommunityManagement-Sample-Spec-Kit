name: Deploy Fix Orchestrate

# Lightweight spec-kit variant for deployment fix issues.
# Triggered when an issue is labelled 'deploy-fix-auto' + 'copilot'.
# Unlike the full speckit-orchestrate.yml, this skips spec/plan/tasks generation
# and goes straight to: create branch → assign to Copilot agent.
#
# Constitution XV — Autonomous Development Pipeline (self-healing extension).

on:
  issues:
    types: [labeled]

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  orchestrate-fix:
    if: >
      contains(github.event.issue.labels.*.name, 'deploy-fix-auto')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Ensure copilot label exists on issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            if (!labels.includes('copilot')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['copilot']
              });
            }

      - name: Create fix branch
        id: branch
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          BRANCH="copilot/deploy-fix/${ISSUE_NUMBER}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --heads origin "${BRANCH}" | grep -q "${BRANCH}"; then
            echo "Branch ${BRANCH} already exists on origin — reusing"
          else
            git checkout -b "${BRANCH}"
            # Use an empty commit instead of marker files to avoid repo accumulation
            git commit --allow-empty -m "chore: scaffold deploy fix for issue #${ISSUE_NUMBER}"
            git push origin "${BRANCH}"
          fi

      - name: Trigger Deploy & Self-Heal workflow
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const issue = context.payload.issue;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-and-heal.yml',
              ref: 'main',
              inputs: {
                environment: 'nightly',
                'deploy-infrastructure': 'true',
                'max-heal-iterations': '3',
                'source-issue-number': String(issue.number)
              }
            });

      - name: Update issue with branch info
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const issue = context.payload.issue;
            const branch = '${{ steps.branch.outputs.branch }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: [
                '🤖 **Deploy Fix Pipeline Started**',
                '',
                `- Branch: \`${branch}\``,
                `- Issue: #${issue.number}`,
                '- Triggered workflow: `Deploy & Self-Heal`',
                '',
                'A Copilot agent will pick up this issue and:',
                '1. Read the deployment error diagnostics above',
                '2. Identify and fix the root cause',
                `3. Create a PR targeting \`main\` with \`Fixes #${issue.number}\``,
                '4. The self-healing pipeline will redeploy automatically after merge',
                '',
                '**Error classification guidelines (Constitution XV):**',
                '- `runtime` / `dependency` / `config` errors → agent can fix autonomously',
                '- `infra` errors → agent can propose a fix, but human review is REQUIRED',
                '- Credential / secret errors → MUST NOT be fixed by agent (label `needs-human-review`)',
              ].join('\n')
            });

            // Keep a no-op re-apply for robustness against external automation.
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['copilot']
            });
