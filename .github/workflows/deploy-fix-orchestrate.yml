name: Deploy Fix Orchestrate

# Lightweight spec-kit variant for deployment fix issues.
# Triggered when an issue is labelled 'deploy-fix-auto' + 'copilot'.
# Unlike the full speckit-orchestrate.yml, this skips spec/plan/tasks generation
# and goes straight to: create branch → assign to Copilot agent.
#
# Constitution XV — Autonomous Development Pipeline (self-healing extension).

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  orchestrate-fix:
    if: >
      github.event.label.name == 'copilot' &&
      contains(github.event.issue.labels.*.name, 'deploy-fix-auto')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Create fix branch and scaffold
        id: branch
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          BRANCH="copilot/deploy-fix/${ISSUE_NUMBER}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"

          # Create a lightweight marker file so the branch has a commit
          mkdir -p .deploy-fixes
          cat > ".deploy-fixes/fix-${ISSUE_NUMBER}.md" << EOF
          # Deploy Fix #${ISSUE_NUMBER}

          Auto-generated by the self-healing deployment pipeline.
          See issue #${ISSUE_NUMBER} for diagnostics and context.

          Created: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          git add ".deploy-fixes/"
          git commit -m "chore: scaffold deploy fix for issue #${ISSUE_NUMBER}"
          git push origin "${BRANCH}"

      - name: Update issue with branch info
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const branch = '${{ steps.branch.outputs.branch }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: [
                '🤖 **Deploy Fix Pipeline Started**',
                '',
                `- Branch: \`${branch}\``,
                `- Issue: #${issue.number}`,
                '',
                'A Copilot agent will pick up this issue and:',
                '1. Read the deployment error diagnostics above',
                '2. Identify and fix the root cause',
                `3. Create a PR targeting \`main\` with \`Fixes #${issue.number}\``,
                '4. The self-healing pipeline will redeploy automatically after merge',
                '',
                '**Error classification guidelines (Constitution XV):**',
                '- `runtime` / `dependency` / `config` errors → agent can fix autonomously',
                '- `infra` errors → agent can propose a fix, but human review is REQUIRED',
                '- Credential / secret errors → MUST NOT be fixed by agent (label `needs-human-review`)',
              ].join('\n')
            });

            // Note: The 'copilot' label was already applied when this workflow
            // triggered (line 21 filters on it). The label re-application below is
            // intentionally kept as a no-op safety net in case external automation
            // removes the label during the orchestration window.
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['copilot']
              });
            } catch (e) {
              // Label already exists — expected
              console.log(`Label already applied: ${e.message}`);
            }
